# Aavaran Golden Benchmark Validation Suite
# Minimum 60 commodity-and-condition cases verified against official literature:
# - USDA Agriculture Handbook 66 (AH-66): Commercial Storage of Fruits, Vegetables & Florist Stocks
# - Indian Institute of Packaging (IIP) Commodity Packaging Manuals & Handbooks
# - Published peer-reviewed Modified Atmosphere Packaging (MAP) literature (Kader, Exama, Labuza)
# - FSSAI Food Safety and Standards Regulations (2018)

cases:
  # -------------------------------------------------------------------------
  # Fresh Vegetables
  # -------------------------------------------------------------------------
  - case_id: "VEG-POT-01"
    commodity: "potato"
    state: "whole_cured"
    environment:
      temperature_c: 12.0
      relative_humidity_pct: 85.0
    expected_outcome:
      viable: true
      limiting_mechanism: "moisture_loss"
      shelf_life_days_range: [120, 180]
      target_barrier:
        max_wvtr: 15.0
        breathability: "macro_ventilated"
      recommended_packaging: "Macro-perforated LDPE or Leno Net Sacks"
    source: "USDA Agriculture Handbook 66, Table 2 (2016) - Solanum tuberosum storage"

  - case_id: "VEG-POT-02"
