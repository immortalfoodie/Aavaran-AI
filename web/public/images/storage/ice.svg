<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" fill="#FFFDF2"/>
  <!-- Ice cube 1 -->
  <polygon points="30,45 60,30 90,45 60,60" fill="#5CE1FF" stroke="#0B0B0B" stroke-width="5"/>
  <polygon points="30,45 60,60 60,95 30,80" fill="#C9FF3D" stroke="#0B0B0B" stroke-width="5"/>
  <polygon points="60,60 90,45 90,80 60,95" fill="#5CE1FF" stroke="#0B0B0B" stroke-width="5"/>
  <!-- Cold droplets / sparkles -->
  <circle cx="22" cy="30" r="4" fill="#0B0B0B"/>
  <circle cx="100" cy="35" r="5" fill="#0B0B0B"/>
  <circle cx="95" cy="85" r="3.5" fill="#0B0B0B"/>
  <circle cx="25" cy="70" r="3" fill="#0B0B0B"/>
  <!-- Ice reflection highlight -->
  <line x1="45" y1="52" x2="52" y2="48" stroke="#0B0B0B" stroke-width="3" stroke-linecap="round"/>
</svg>
