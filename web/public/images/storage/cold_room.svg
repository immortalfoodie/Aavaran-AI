<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" fill="#FFFDF2"/>
  <!-- Refrigerator / Cold Room chamber -->
  <rect x="20" y="15" width="80" height="90" fill="#5CE1FF" stroke="#0B0B0B" stroke-width="6"/>
  <!-- Heavy insulated door line -->
  <line x1="75" y1="15" x2="75" y2="105" stroke="#0B0B0B" stroke-width="5"/>
  <!-- Handle -->
  <rect x="65" y="50" width="6" height="22" fill="#0B0B0B"/>
  <!-- Snowflake icon -->
  <g transform="translate(42, 60)" stroke="#0B0B0B" stroke-width="4" stroke-linecap="round">
    <line x1="-16" y1="0" x2="16" y2="0"/>
    <line x1="0" y1="-16" x2="0" y2="16"/>
    <line x1="-11" y1="-11" x2="11" y2="11"/>
    <line x1="-11" y1="11" x2="11" y2="-11"/>
  </g>
  <!-- Temperature badge -->
  <rect x="28" y="22" width="34" height="14" fill="#0B0B0B"/>
  <text x="45" y="33" fill="#FFFDF2" font-family="monospace" font-weight="900" font-size="10" text-anchor="middle">4°C</text>
</svg>
